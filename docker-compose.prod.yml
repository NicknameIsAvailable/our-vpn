services:
  postgres:
    image: postgres:15
    container_name: postgres-db
    env_file:
      - .env.production
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  db:
    image: ksotneo/vpn-service:db-prod
    container_name: db
    env_file:
      - .env.production
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - app-network

  api:
    image: ksotneo/vpn-service:api-prod
    container_name: api
    env_file:
      - .env.production
    depends_on:
      - postgres
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: ${API_PORT}
      API_URL: ${API_URL}
      API_TOKEN: ${API_TOKEN}
    ports:
      - "${API_PORT}:${API_PORT}"
    networks:
      - app-network

  tg-bot:
    image: ksotneo/vpn-service:tg-bot-prod
    container_name: tg-bot
    env_file:
      - .env.production
    depends_on:
      - postgres
      - api
    environment:
      API_PORT: ${API_PORT}
      API_URL: ${API_URL}
      API_TOKEN: ${API_TOKEN}
      BOT_NAME: ${BOT_NAME}
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGROM_BOT_API_TOKEN: ${TELEGROM_BOT_API_TOKEN}
      TELEGRAM_PAYMENT_TOKEN: ${TELEGRAM_PAYMENT_TOKEN}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
